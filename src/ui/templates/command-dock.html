  <!-- Unified bottom command dock: locations, voice (injected at runtime), visual presets -->
  <div id="command-dock" aria-label="导航、语音与视觉预设">
  <!-- Control panel -->
  <div id="control-panel" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="panel-inner">
      <button id="control-panel-toggle" class="panel-header dock-tray-toggle" type="button"
        data-dock-toggle-target="control-panel" aria-expanded="false"
        aria-controls="control-panel-popover" aria-label="展开视觉预设">
        <span class="panel-title"><span class="dock-label-icon dock-label-icon-presets" aria-hidden="true"></span>视觉预设</span>
        <span class="panel-divider"></span>
      </button>
      <div id="control-panel-popover" class="dock-popover-content">
      <button class="dock-pin-btn" data-pin-target="control-panel" type="button" aria-label="固定视觉预设" aria-pressed="false" title="保持视觉预设打开"><img src="/pin.svg" alt="" /></button>
      <div id="style-buttons" class="button-grid">
        <button class="style-btn active" data-style="normal" title="不加滤镜，直接显示地球。">
          <span class="btn-icon">◯</span>
          <span class="btn-label">常规</span>
          <span class="btn-key">1</span>
        </button>
        <button class="style-btn" data-style="retro" title="绿色磷光 CRT，带扫描线和屏幕弯曲。">
          <span class="btn-icon">▦</span>
          <span class="btn-label">CRT</span>
          <span class="btn-key">2</span>
        </button>
        <button class="style-btn" data-style="surveillance" title="夜视仪：绿色增强和圆形暗角。">
          <span class="btn-icon">🌙</span>
          <span class="btn-label">夜视</span>
          <span class="btn-key">3</span>
        </button>
        <button class="style-btn" data-style="thermal" title="热成像对比。调高铁弓色可上色。">
          <span class="btn-icon">🌡️</span>
          <span class="btn-label">热成像</span>
          <span class="btn-key">4</span>
        </button>
        <button class="style-btn" data-style="anime" title="明亮的赛璐璐上色和描边。">
          <span class="btn-icon">✦</span>
          <span class="btn-label">动漫</span>
          <span class="btn-key">5</span>
        </button>
        <button class="style-btn" data-style="noir" title="高对比黑白电影调色。">
          <span class="btn-icon">◐</span>
          <span class="btn-label">黑白</span>
          <span class="btn-key">6</span>
        </button>
        <button class="style-btn" data-style="snow" title="冷色风雪白化。">
          <span class="btn-icon">❄</span>
          <span class="btn-label">风雪</span>
          <span class="btn-key">7</span>
        </button>
      </div>
      <section class="map-source-section" aria-labelledby="map-source-label">
        <div class="map-source-heading">
          <span id="map-source-label">地图来源</span>
          <span id="map-stack-status" class="pp-stack-status" aria-live="polite">3D</span>
        </div>
        <div id="map-stack-chips" class="map-stack-chip-row" role="group" aria-label="地图来源"></div>
      </section>
      </div>
      <div id="style-mini-status" class="panel-mini-status" aria-live="polite">
        <span class="panel-mini-label">风格</span>
        <span id="style-mini-value" class="panel-mini-value">常规</span>
      </div>
    </div>
  </div>

  <!-- Location bar -->
  <div id="location-bar" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="location-inner">
      <div class="location-toolbar">
        <button id="location-bar-toggle" class="dock-tray-toggle" type="button" data-dock-toggle-target="location-bar"         aria-controls="location-bar-popover" aria-expanded="false" aria-label="展开位置" title="展开位置">
          <span class="location-toolbar-label"><span class="dock-label-icon dock-label-icon-location" aria-hidden="true"></span>位置</span>
        </button>
        <button class="panel-collapse-btn" data-collapse-target="location-bar" title="收起">+</button>
      </div>
      <div id="location-mini-status" class="location-mini-status" aria-live="polite">
        <div id="location-mini-city" class="location-mini-city">📍 位置 --</div>
        <div id="location-mini-poi" class="location-mini-poi">地标 --</div>
      </div>
      <div id="location-bar-popover" class="dock-popover-content">
        <button class="dock-pin-btn" data-pin-target="location-bar" type="button" aria-label="固定位置托盘" aria-pressed="false" title="保持位置托盘打开"><img src="/pin.svg" alt="" /></button>
        <div id="poi-row" class="poi-row-container"></div>
        <div class="location-bar-divider" id="location-bar-divider"></div>
        <div class="location-city-row">
          <div id="location-pills" class="location-pills"></div>
          <div class="location-search-wrap">
            <button id="search-toggle" class="search-toggle-btn" title="搜索任意地点">
              <span>&#x1F50E;</span>
            </button>
            <input type="text" id="location-search" placeholder="搜索地点或坐标…" autocomplete="off" spellcheck="false" aria-label="按名称或坐标搜索位置" />
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
