  <!-- Post-processing toggles (top-right) -->
  <div id="pp-toggles" class="panel-collapsible collapsed" data-panel-id="pp-toggles">
    <div class="compact pp-header-row">
      <span class="pp-header-label">显示</span>
      <span class="panel-divider" aria-hidden="true"></span>
      <button class="panel-collapse-btn pp-collapse-btn" data-collapse-target="pp-toggles" title="收起">&#x25C0;</button>
    </div>
    <div class="pp-panel-body" data-rail-scroller>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="hud-toggle" title="情报 HUD（H）">
        <span class="pp-icon">&#x25CE;</span>
        <span class="pp-label">HUD</span>
      </button>
      <div class="pp-slider-row" id="hud-layout-row">
        <span class="pp-slider-mini-label">布局</span>
        <select id="hud-layout-select" class="pp-select" aria-label="HUD 布局">
          <option value="tactical">战术</option>
          <option value="operator">操作员</option>
          <option value="minimal">极简</option>
          <option value="cyber">赛博</option>
        </select>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-toggle-row" id="cyber-sonar-row">
        <span class="pp-slider-mini-label">声呐</span>
        <button class="pp-mode-btn active" id="cyber-sonar-toggle" title="赛博声呐目标扫描" aria-label="赛博声呐目标扫描" aria-pressed="true">开</button>
      </div>
      <output id="cyber-sonar-status" class="cyber-sonar-control" role="status"></output>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-rings-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-rings">环数</label>
        <input type="range" class="pp-slider" id="cyber-sonar-rings" min="3" max="12" step="1" value="8" aria-label="声呐环数" />
        <span class="pp-slider-value" id="cyber-sonar-rings-value">8</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-range-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-range">范围</label>
        <input type="range" class="pp-slider" id="cyber-sonar-range" min="60" max="120" step="1" value="100" aria-label="声呐环范围" />
        <span class="pp-slider-value" id="cyber-sonar-range-value">100%</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-intensity-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-intensity">功率</label>
        <input type="range" class="pp-slider" id="cyber-sonar-intensity" min="0" max="100" step="1" value="70" aria-label="声呐强度" />
        <span class="pp-slider-value" id="cyber-sonar-intensity-value">70%</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-opacity-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-opacity">不透明度</label>
        <input type="range" class="pp-slider" id="cyber-sonar-opacity" min="35" max="100" step="1" value="84" aria-label="赛博目标与标签不透明度" title="声呐扫描间隙中地图点、图标、模型、括号与标签的最低不透明度" />
        <span class="pp-slider-value" id="cyber-sonar-opacity-value">84%</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-sector-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-sector">扇区</label>
        <input type="range" class="pp-slider" id="cyber-sonar-sector" min="8" max="60" step="1" value="24" aria-label="声呐扇区宽度" />
        <span class="pp-slider-value" id="cyber-sonar-sector-value">24°</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="detection-toggle" title="探测叠加（D）" aria-label="探测叠加" aria-pressed="false">
        <span class="pp-icon">&#x25A3;</span>
        <span class="pp-label">探测</span>
      </button>
      <div class="pp-slider-row detection-slider-row" id="detection-slider-row">
        <label class="pp-slider-mini-label" for="detection-density-slider">密度</label>
        <input type="range" class="pp-slider" id="detection-density-slider" min="0" max="100" step="25" value="50" aria-label="探测标签密度" />
        <span class="pp-slider-value" id="detection-density-value">50%</span>
      </div>
      <div class="pp-slider-row detection-allocation-row" id="detection-allocation-row">
        <span class="pp-slider-mini-label">资源分配</span>
        <div class="pp-mode-seg detection-allocation-seg" role="radiogroup" aria-label="探测标签资源分配">
          <button class="pp-mode-btn active" id="detection-allocation-elastic" data-allocation="ELASTIC" role="radio" aria-checked="true">弹性</button>
          <button class="pp-mode-btn" id="detection-allocation-weighted" data-allocation="WEIGHTED" role="radio" aria-checked="false">加权</button>
        </div>
      </div>
      <div class="pp-slider-row detection-fade-row" id="detection-fade-row">
        <label class="pp-slider-mini-label" for="detection-fade-slider">淡出</label>
        <input type="range" class="pp-slider" id="detection-fade-slider" min="0" max="40" step="1" value="7" aria-label="探测淡出距离" title="钥匙孔外世界叠加淡出距离（占半径百分比）" />
        <span class="pp-slider-value" id="detection-fade-value">7%</span>
      </div>
      <div class="pp-slider-row detection-opacity-row" id="detection-opacity-row">
        <label class="pp-slider-mini-label" for="detection-opacity-slider">外侧</label>
        <input type="range" class="pp-slider" id="detection-opacity-slider" min="0" max="100" step="1" value="1" aria-label="钥匙孔外探测不透明度" title="淡出距离之外世界叠加标签与卡片的不透明度" />
        <span class="pp-slider-value" id="detection-opacity-value">1%</span>
      </div>
    </div>
    <!-- The one shared preset-parameter surface is inserted here at runtime. -->
    <div id="param-slider-panel">
      <div class="param-panel-header">
        <span class="param-panel-title">参数</span>
        <span class="param-panel-divider"></span>
        <button class="panel-collapse-btn" id="param-panel-collapse-btn" data-collapse-target="param-slider-panel" title="收起">−</button>
      </div>
      <div id="param-sliders"></div>
    </div>
    <div class="pp-toggle-group">
      <!-- 3D aircraft is DEFAULT-ON in Proximity (owner directive 2026-08-22), so the
           button ships lit and the mode row ships open — the same markup-carries-the-default
           convention as #scope-toggle. ui.js re-syncs both from durable layer state, which
           is what flips them back for a share link or a stored session carrying 3D off. -->
      <button class="pp-toggle-btn active" id="models3d-toggle" aria-pressed="true" title="三维航空器 — 远距平面图标，近距三维模型">
        <span class="pp-icon">&#x2708;</span>
        <span class="pp-label">3D</span>
      </button>
      <div class="pp-slider-row visible" id="models3d-mode-row">
        <span class="pp-slider-mini-label">模型</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="三维模型覆盖范围">
          <button class="pp-mode-btn active" id="models3d-mode-proximity" data-mode="proximity" role="radio" aria-checked="true">邻近</button>
          <button class="pp-mode-btn" id="models3d-mode-all" data-mode="all" role="radio" aria-checked="false">全部</button>
        </div>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="scope-toggle" title="圆形取景，点击开关" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">adjust</span>
        <span class="pp-label">取景</span>
      </button>
      <div class="pp-slider-row visible" id="scope-slider-row">
        <span class="pp-slider-mini-label">羽化</span>
        <!-- Feather starts at an 11% soft scope-mask edge (owner final lock
             2026-08-24, superseding the 08-22 hard-crop and 08-23 8% rulings);
             mirrors SCOPE_FEATHER_RATIO_DEFAULT in src/scopeMask.js. Feather
             softens the black mask edge; label fading is the separate Fade
             slider. -->
        <input type="range" class="pp-slider" id="scope-feather-slider" min="0" max="100" value="11" aria-label="取景边缘羽化" title="取景边缘羽化（占钥匙孔半径百分比）" />
        <span class="pp-slider-value" id="scope-feather-value">11%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="draw-toggle" title="在世界上绘制 — 点击顶点，双击或 Enter 完成，Esc 取消" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">draw</span>
        <span class="pp-label">绘制</span>
      </button>
      <div class="pp-slider-row" id="draw-mode-row">
        <span class="pp-slider-mini-label">形状</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="绘制形状">
          <button class="pp-mode-btn active" data-shape="area" role="radio" aria-checked="true">区域</button>
          <button class="pp-mode-btn" data-shape="line" role="radio" aria-checked="false">折线</button>
          <button class="pp-mode-btn" data-shape="pin" role="radio" aria-checked="false">钉点</button>
        </div>
      </div>
      <div class="pp-slider-row" id="draw-label-row">
        <input type="text" class="pp-text-input" id="draw-label-input" maxlength="120" placeholder="标签（可选）" aria-label="绘制形状的标签" autocomplete="off" spellcheck="false">
        <select class="pp-select draw-color-select" id="draw-color-select" aria-label="绘制形状颜色">
          <option value="primary">主色</option>
          <option value="amber">琥珀</option>
          <option value="cyan">青色</option>
          <option value="green">绿色</option>
          <option value="red">红色</option>
        </select>
        <button class="pp-mode-btn draw-clear-btn" id="draw-clear" type="button" title="清除画板上全部标记">清除</button>
        <span class="draw-hint" id="draw-hint" aria-live="polite"></span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="celestial-toggle" title="天体环 — 展开完整地球" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">flare</span>
        <span class="pp-label">天体</span>
      </button>
    </div>
    <button class="pp-toggle-btn" id="clean-view-toggle" title="隐藏界面边框">
      <span class="pp-icon">&#x25A1;</span>
      <span class="pp-label">纯净界面</span>
    </button>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="bloom-toggle" title="辉光">
        <span class="pp-icon">&#x2728;</span>
        <span class="pp-label">辉光</span>
      </button>
      <div class="pp-slider-row" id="bloom-slider-row">
        <input type="range" class="pp-slider" id="bloom-intensity-slider" min="0" max="200" value="0" aria-label="辉光强度" />
        <span class="pp-slider-value" id="bloom-intensity-value">0%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="sharpen-toggle" title="锐化">
        <span class="pp-icon">&#x1F50D;</span>
        <span class="pp-label">锐化</span>
      </button>
      <div class="pp-slider-row" id="sharpen-slider-row">
        <input type="range" class="pp-slider" id="sharpen-intensity-slider" min="0" max="100" value="49" aria-label="锐化强度" />
        <span class="pp-slider-value" id="sharpen-intensity-value">49%</span>
      </div>
    </div>
  </div>
  </div>
  <button id="clean-view-exit" title="恢复界面控件">退出简洁视图</button>
