  <div id="left-panel-stack">
  <!-- Data Layer Toggle Panel -->
  <div id="data-panel" class="panel-collapsible collapsed active" data-panel-id="data-panel">
    <div class="panel-glow"></div>
    <div class="data-panel-inner">
      <div class="panel-header">
        <span class="panel-title">数据图层</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="data-panel" title="收起">+</button>
      </div>
      <div id="data-toggles" class="data-toggle-list"></div>
    </div>
  </div>

  <!-- CCTV Coverage Panel -->
  <div id="cctv-panel" class="panel-collapsible collapsed" data-panel-id="cctv-panel">
    <div class="panel-glow"></div>
    <div class="cctv-panel-inner" data-rail-scroller>
      <div class="panel-header">
        <span class="panel-title">CCTV</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="cctv-panel" title="收起">+</button>
      </div>
      <div class="cyber-panel-body" data-rail-scroller>
      <div id="cctv-frame-wrap" class="cctv-frame-wrap">
        <img id="cctv-frame" alt="CCTV feed frame" />
        <canvas id="cctv-video" class="cctv-frame" hidden></canvas>
      </div>
      <div id="cctv-source-badge" role="status" aria-live="polite">来源 · 未知</div>
      <div id="cctv-meta">开启监控以加载路口摄像头</div>
      <div class="cctv-controls">
        <button id="cctv-enable-btn" class="scene-btn">监控 关</button>
        <button id="cctv-nearest-btn" class="scene-btn">NEAREST</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-prev-btn" class="scene-btn">PREV</button>
        <select id="cctv-camera-select" aria-label="监控摄像头"></select>
        <button id="cctv-next-btn" class="scene-btn">NEXT</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-focus-btn" class="scene-btn">FOCUS</button>
        <button id="cctv-coverage-btn" class="scene-btn">覆盖 关</button>
        <button id="cctv-auto-hop-btn" class="scene-btn">自动跳转 关</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-projection-btn" class="scene-btn">投影 开</button>
        <span id="cctv-quality-chip">CAL · --</span>
      </div>
      <div class="cctv-calibration-block">
        <div class="cctv-calibration-header">
          <div class="cctv-summary-label">标定</div>
          <button id="cctv-adjust-btn" class="scene-btn" title="在场景中拖动相机：圆环旋转，箭头平移，手柄调距离/视场">调整</button>
        </div>
        <div id="cctv-cal-readout" class="cctv-cal-readout" aria-label="相机姿态 — 点击数值可输入">
          <button class="cctv-cal-value" data-cal-field="heading" title="Heading (compass °) — click to type">HDG --</button>
          <button class="cctv-cal-value" data-cal-field="pitch" title="Pitch (° up/down) — click to type">PITCH --</button>
          <button class="cctv-cal-value" data-cal-field="fov" title="Horizontal FOV (°) — click to type">FOV --</button>
          <button class="cctv-cal-value" data-cal-field="range" title="Range / monitor-plane distance (m) — click to type">RANGE --</button>
          <button class="cctv-cal-value" data-cal-field="height" title="Mount height above ground (m) — click to type">HGT --</button>
          <button class="cctv-cal-value" data-cal-field="north" title="North offset from catalog position (m) — click to type">ΔN --</button>
          <button class="cctv-cal-value" data-cal-field="east" title="East offset from catalog position (m) — click to type">ΔE --</button>
        </div>
        <div class="cctv-controls cctv-calibration-actions">
          <button id="cctv-calib-save-btn" class="scene-btn">保存标定</button>
          <button id="cctv-calib-reset-btn" class="scene-btn">重置标定</button>
        </div>
      </div>
      <div class="cctv-summary-label">场景摘要</div>
      <div id="cctv-summary">开启监控后可生成镜头关联情报摘要。</div>
      </div>
    </div>
  </div>

  <!-- Street Level Panel (moved into #right-context-rail at runtime) -->
  <div id="street-level-panel" class="panel-collapsible collapsed" data-panel-id="street-level-panel">
    <div class="panel-glow"></div>
    <div class="street-level-panel-inner" data-rail-scroller>
      <div class="panel-header">
        <span class="panel-title">街景</span>
        <span class="panel-divider"></span>
        <button id="sl-status" class="sl-status" type="button" aria-pressed="false" title="打开或关闭街景">关</button>
        <button class="panel-collapse-btn" data-collapse-target="street-level-panel" title="展开面板">◀</button>
      </div>
      <div id="sl-body" class="sl-body">
        <div class="sl-main">
          <div id="sl-viewer-wrap" class="sl-viewer-wrap" hidden>
            <div class="sl-viewer-bar">
              <div class="sl-viewer-tools">
                <button id="sl-viewer-expand" class="scene-btn" type="button" aria-pressed="false" title="放大街景视图（Esc 缩小）"><span class="sl-btn-icon" aria-hidden="true">⤢</span><span class="sl-btn-text">放大</span></button>
                <div class="sl-seg" role="radiogroup" aria-label="画面适配">
                  <button type="button" class="sl-seg-btn is-active" data-sl-render="letterbox" role="radio" aria-checked="true" title="适应：完整显示照片，比例不同处留黑边">适应</button>
                  <button type="button" class="sl-seg-btn" data-sl-render="fill" role="radio" aria-checked="false" tabindex="-1" title="铺满：裁切后铺满画面">铺满</button>
                </div>
                <button id="sl-follow-btn" class="scene-btn" type="button" aria-pressed="false" aria-label="相机跟随视图" title="相机跟随：街景朝向哪里，地球相机跟到哪里"><span class="sl-btn-icon" aria-hidden="true">⌖</span><span class="sl-btn-text">跟随</span></button>
              </div>
              <div class="sl-viewer-tools sl-viewer-tools-right">
                <button id="sl-viewer-close" class="sl-viewer-x" type="button" title="关闭图片并取消地图选中" aria-label="关闭街景图片">×</button>
              </div>
            </div>
            <div class="sl-viewer-stage">
              <div id="sl-viewer-placeholder" class="sl-viewer-placeholder" hidden></div>
              <div id="sl-viewer" class="sl-viewer" aria-label="街景查看器"></div>
            </div>
            <div id="sl-image-meta" class="sl-image-meta">
              <span id="sl-image-by" class="sl-image-by"></span>
              <span class="sl-image-right">
                <span id="sl-image-when" class="sl-image-when"></span>
                <a id="sl-image-link" class="sl-image-link" href="#" target="_blank" rel="noopener noreferrer" title="在数据提供方网站打开此图" hidden></a>
              </span>
            </div>
          </div>
          <div class="sl-settings">
            <div class="sl-providers" role="group" aria-label="影像来源">
              <span class="cctv-summary-label">来源</span>
              <div id="sl-provider-chips" class="sl-chips"></div>
            </div>
            <div id="sl-error" class="sl-error" role="alert" hidden><span aria-hidden="true">⚠</span> <span id="sl-error-text"></span></div>
            <!-- A missing key gates the filters only: the chips above stay
                 focusable so their tooltip can say how to add the key. -->
            <fieldset id="sl-controls" class="sl-controls">
              <div class="sl-filters" role="group" aria-label="Imagery filters">
                <span class="cctv-summary-label">IMAGERY</span>
                <div class="sl-seg" role="radiogroup" aria-label="Panorama filter">
                  <button type="button" class="sl-seg-btn is-active" data-sl-pano="all" role="radio" aria-checked="true">ALL</button>
                  <button type="button" class="sl-seg-btn" data-sl-pano="pano" role="radio" aria-checked="false" tabindex="-1">360°</button>
                  <button type="button" class="sl-seg-btn" data-sl-pano="flat" role="radio" aria-checked="false" tabindex="-1">FLAT</button>
                </div>
              </div>
              <div class="sl-since">
                <label class="cctv-summary-label" for="sl-since">SINCE</label>
                <input id="sl-since" class="sl-range" type="range" min="0" max="8" step="1" value="0" aria-valuetext="ANY DATE" aria-describedby="sl-since-label" />
                <output id="sl-since-label" class="sl-since-label" for="sl-since">ANY DATE</output>
              </div>
            </fieldset>
            <ul id="sl-legend" class="sl-legend" aria-label="Coverage colours"></ul>
            <div id="sl-coverage-meta" class="sl-meta"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scene Director Panel -->
  <div id="scene-panel" class="panel-collapsible collapsed" data-panel-id="scene-panel">
    <div class="panel-glow"></div>
    <div class="scene-panel-inner">
      <div class="panel-header">
        <span class="panel-title">场景</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="scene-panel" title="收起">+</button>
      </div>
      <div class="scene-controls">
        <select id="scene-select" aria-label="Scene recipe"></select>
        <button id="scene-new-btn" class="scene-btn">NEW</button>
        <button id="scene-delete-btn" class="scene-btn scene-btn-danger">DEL</button>
      </div>
      <div class="scene-controls">
        <button id="scene-capture-btn" class="scene-btn">CAPTURE SHOT</button>
        <button id="scene-update-shot-btn" class="scene-btn">UPDATE SHOT</button>
      </div>
      <div id="scene-shot-list" class="scene-shot-list"></div>
      <div class="scene-controls">
        <button id="scene-start-btn" class="scene-btn">START</button>
        <button id="scene-stop-btn" class="scene-btn scene-btn-danger">STOP</button>
        <button id="scene-next-btn" class="scene-btn">NEXT</button>
      </div>
      <div class="scene-controls">
        <button id="scene-export-btn" class="scene-btn">EXPORT PRESETS</button>
        <button id="scene-import-btn" class="scene-btn">IMPORT</button>
        <button id="scene-download-btn" class="scene-btn">RUN LOG</button>
        <input type="file" id="scene-import-file" accept="application/json,.json" hidden />
      </div>
      <div class="scene-progress">
        <div id="scene-progress-fill">0%</div>
      </div>
      <div id="scene-status">Ready</div>
    </div>
  </div>

  </div>
